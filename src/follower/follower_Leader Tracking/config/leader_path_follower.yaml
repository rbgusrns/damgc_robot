/leader_path_follower:
  ros__parameters:
    leader_odom_topic: /leader/odom/raw
    follower_odom_topic: /follower/odom/raw
    leader_command_topic: /leader/cmd_vel
    command_topic: /follower/cmd_vel
    frame_id: odom

    manual_linear_speed: 0.05
    manual_angular_speed: 0.15

    max_linear_speed: 0.25
    max_angular_speed: 0.15

    lookahead_distance: 0.08
    path_point_spacing: 0.01
    goal_tolerance: 0.005

    pose_timeout: 3.0
    leader_command_timeout: 0.50
    key_timeout: 0.25

    max_path_error: 0.40
    heading_gain: 0.8
    turn_in_place_angle: 1.05
    publish_rate: 20.0
    maximum_path_points: 20000

    opposite_facing: true
