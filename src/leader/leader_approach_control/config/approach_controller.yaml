/leader/approach_controller:
  ros__parameters:
    base_frame: base_link
    target_tag_id: 0
    controller_enabled_on_startup: false
    controller_publish_rate: 20.0
    controller_pose_timeout: 0.35
    sample_sync_tolerance: 0.10

    # Provisional topic-level software-validation values only.
    # Keep target_forward equal to rescue_robot_apriltag's base_target_forward.
    # It is not a calibrated grasp or physical gripper target.
    # Gains and raw limits are not final motor tuning or a final safety clamp.
    target_forward: 0.50
    linear_gain: 0.20
    angular_gain: 0.80
    lateral_gain: 0.50
    max_raw_linear_speed: 0.05
    max_raw_angular_speed: 0.20
    allow_reverse: false
